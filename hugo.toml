title = "awydd"
locale = "zh-CN"
enableEmoji = true

[module]
  [[module.imports]]
    path = "github.com/luizdepra/hugo-coder"
    disable = false

[pagination]
pagerSize = 20

[markup]
[markup.highlight]
noClasses = true

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[params]
info = ["人间正道是沧桑"]
avatarURL = "images/avatar.svg"
