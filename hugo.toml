since = 2026
colorScheme = "auto"
customSCSS = ["scss/custom.scss"]

[taxonomies]
category = "categories"
series = "series"
tag = "tags"
author = "authors"

[[params.social]]
name = "Github"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/awydd/"

[[menu.main]]
name = "文章"
weight = 1
url = "posts/"

[[menu.main]]
name = "关于我"
weight = 2
